
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Google Photos</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Top Navbar -->
    <header class="navbar">
        <div class="logo">
            <img src="images\ii.jpg" alt="Google Photos">
            <span>Google Photos</span>
        </div>

        <div class="search">
            <span>🔍</span>
            <input type="text" placeholder="Search your photos">
        </div>

        <div class="profile">
            <span>⚙</span>
            <span>❔</span>
            <span class="user">M</span>
        </div>
    </header>

    <!-- Main Layout -->
    <div class="main">

        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="menu active">🖼️ <span>Photos</span></div>
            <div class="menu">⭐ <span>Favorites</span></div>
            <div class="menu">📁 <span>Albums</span></div>
            <div class="menu">🗃️ <span>Archive</span></div>
            <div class="menu">🗑️ <span>Trash</span></div>

            <hr>

            <div class="menu">📤 <span>Sharing</span></div>
            <div class="menu">📷 <span>Google Photos</span></div>
        </aside>

        <!-- Photos Section -->
        <main class="content">

            <h1>Photos</h1>
            <p class="subtitle">Your memories in one place</p>

            <h2>Today</h2>

            <div class="photo-grid">

                <img src="../static.1/images\ii.jpg" alt="Mountain">
                
                <img src="../static.1/images\jj.jpg" alt="Beach">

                <img src="../static.1/images\kk.jpg" alt="Nature">

                <img src="images\pp.jpg" alt="Sea">

                <img src="../static.1/images\ii.jpg" alt="Deer">

                <img src="../static.1/images\mm.jpg" alt="Mountain view">

                <img src="../static.1/images\nn.jpg" alt="Forest">

                <img src="../static.1/images\oo.jpg" alt="Forest">

                <img src="../static.1/images\image.png" alt="Lake">

                <img src="../static.1/images\jj.jpg" alt="Trees">

                <img src="../static.1/images\oo.jpg" alt="Landscape">

                <img src="../static.1/images\ii.jpg" alt="Mountains">

            </div>

            <h2>Yesterday</h2>

            <div class="photo-grid">

                <img src="../static.1/images\gg.jpg" alt="Sunrise">

                <img src="../static.1/images\hh.avif" alt="Japan">

                <img src="../static.1/images\iee.avif" alt="Nature">

            </div>

        </main>
    </div>

</body>
</html>
