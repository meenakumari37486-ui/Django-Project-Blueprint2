<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Google Maps</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header class="topbar">
        <div class="logo">☰</div>

        <div class="search-box">
            <input type="text" placeholder="Search Google Maps">
            <button>🔍</button>
        </div>

        <div class="profile">M</div>
    </header>

    <aside class="sidebar">
        <div class="side-item active">
            <span>🏠</span>
            <p>Home</p>
        </div>

        <div class="side-item">
            <span>⭐</span>
            <p>Saved</p>
        </div>

        <div class="side-item">
            <span>🕘</span>
            <p>Recent</p>
        </div>

        <div class="side-item">
            <span>🚌</span>
            <p>Transit</p>
        </div>

        <div class="side-item">
            <span>🚲</span>
            <p>Explore</p>
        </div>
    </aside>

    <main class="map-area">

        <iframe src="https://maps.google.com/maps?q=Bengaluru&t=&z=13&ie=UTF8&iwloc=&output=embed">
        </iframe>

        <div class="map-buttons">
            <button>+</button>
            <button>−</button>
        </div>

        <div class="place-card">
            <h2>Explore Bengaluru</h2>
            <p>Discover places, restaurants and nearby locations.</p>
            <button class="explore-btn">Explore places</button>
        </div>

    </main>

</body>

</html>
