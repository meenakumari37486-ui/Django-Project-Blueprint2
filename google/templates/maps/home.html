{% load static %}
<!DOCTYPE html>
<html>
<head>
    <title>Google Maps</title>
    <link rel="stylesheet" href="{% static 'css/maps.css' %}">
</head>
<body>

    <header>
        <h2>📍 Google Maps</h2>
        <input type="text" placeholder="Search Google Maps">
        <button>Search</button>
    </header>

    <div class="container">

        <div class="sidebar">
            <h3>Menu</h3>
            <p>🏠 Home</p>
            <p>⭐ Saved Places</p>
            <p>🕒 Recent</p>
            <p>📍 Your Location</p>
            <p>🗺️ Directions</p>
        </div>

        <div class="map">
            <iframe
                src="https://maps.google.com/maps?q=Bengaluru&t=&z=12&ie=UTF8&iwloc=&output=embed""
                width="100%"
                height="550"
                style="border:0;"
                allowfullscreen=""
                loading="lazy">
            </iframe>
        </div>

    </div>

</body>
</html>
